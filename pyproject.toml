[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us-music-charts-analytics"
version = "0.1.0"
description = "Windows desktop analytics for user-supplied US music chart data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
build = ["pyinstaller>=6.10.0", "Pillow>=10.0.0"]

[project.scripts]
us-music-charts-analytics = "spotify_historical_analytics.__main__:main"
spotify-historical-analytics = "spotify_historical_analytics.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
exclude = ["build/**", "dist/**"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
